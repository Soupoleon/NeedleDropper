# Shared by branch/PR CI and tagged releases. No publishing credentials are passed here.
name: Tests

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit to validate (defaults to the caller's commit)
        type: string
        default: ""
      build_tools:
        description: Also exercise frozen-launcher tests on the release Python
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: companion/build-requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest lupa

      - name: Install frozen-launcher test tools
        if: inputs.build_tools && matrix.python == '3.14'
        run: python -m pip install -r companion/build-requirements.txt

      # Before release version stamping: tests compare the source TOC byte for byte.
      - name: Run test suite (addon via Lua 5.1 shim, companion, contracts)
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Bundled soundtrack sets are up to date
        run: python tools/gen_sets.py --check

      - name: Byte-compile companion
        run: python -m compileall -q companion
