name: Idea or feature request
description: Suggest something new for NeedleDropper, a change to how it works, or a song for a place.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Ideas from players shape what NeedleDropper becomes.

        A few things NeedleDropper will never do, because Blizzard's add-on rules, Spotify or YouTube don't allow them: read or change the game's memory, press keys or click for you, play YouTube in a hidden player or skip its ads, ship music files, or share one Spotify developer app with everyone. See [Policies](https://github.com/Soupoleon/NeedleDropper/blob/main/docs/POLICY.md).

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like NeedleDropper to do?
    validations:
      required: true

  - type: textarea
    id: moment
    attributes:
      label: When would it help?
      description: >-
        The moment in the game (or on the PC) where you missed it. A concrete example is perfect.
      placeholder: >-
        When I fly into Stormwind on a gryphon, the drop waits until I land, and by then the
        moment is gone.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options:
        - Needle drops (when and where songs start)
        - The title card
        - The NeedleDropper window
        - Soundtracks and share codes
        - A song or place for a built-in soundtrack
        - Spotify
        - YouTube
        - In-game audio files
        - The app (Connect page, tray icon)
        - Playing with a controller
        - Documentation
        - Something else

  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: A setting, a command or a workaround you use now, if any.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots, or links to other addons that do something similar.
